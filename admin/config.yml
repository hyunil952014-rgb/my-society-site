backend:
  name: git-gateway
  branch: main

# Netlify Identity(무료)로 로그인한 사용자가 "저장"을 누르면
# 이 저장소(main 브랜치)에 자동으로 커밋됩니다. 코드를 몰라도 됩니다.
#
# 임원진/공지사항/교육안내는 "폴더 컬렉션"이라 게시판처럼 글 목록에서
# 새 글 추가, 개별 글 수정·삭제가 됩니다. 저장하면 Netlify가 자동으로
# scripts/build_content.py를 실행해 화면에 보이는 목록 파일을 다시 만듭니다.

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "site"
    label: "학회 소개 / 기본 정보"
    files:
      - file: "content/site.json"
        label: "학회 기본 정보"
        name: "site"
        fields:
          - { label: "학회명(국문)", name: "orgName", widget: "string" }
          - { label: "학회명(영문)", name: "orgNameEn", widget: "string", required: false }
          - { label: "슬로건/한줄소개", name: "tagline", widget: "string" }
          - label: "메인 화면 소개글 (홈 상단에 표시, 3~4줄 권장)"
            name: "homeIntro"
            widget: "text"
            required: false
          - label: "학회 소개"
            name: "about"
            widget: "object"
            fields:
              - { label: "인사말 (비워두면 인사말 항목이 숨겨집니다)", name: "greeting", widget: "text", required: false }
              - { label: "인사말 서명 (예: 근거중심도수물리치료한국학회 회장 홍길동)", name: "greetingSignature", widget: "string", required: false }
              - { label: "소개글", name: "intro", widget: "text" }
              - { label: "설립 목적", name: "purpose", widget: "text" }
              - { label: "조직 안내", name: "organization", widget: "text", required: false }
          - label: "연혁"
            name: "history"
            widget: "list"
            summary: "{{year}} - {{event}}"
            fields:
              - { label: "연도", name: "year", widget: "string" }
              - { label: "내용", name: "event", widget: "string" }
          - label: "연락처 / 사무국 안내"
            name: "contact"
            widget: "object"
            required: false
            fields:
              - { label: "이메일", name: "email", widget: "string", required: false }
              - { label: "전화번호", name: "phone", widget: "string", required: false }
              - { label: "주소", name: "address", widget: "string", required: false }
              - { label: "운영 시간 (예: 평일 09:00~18:00)", name: "officeHours", widget: "string", required: false }
              - { label: "안내 문구", name: "officeNote", widget: "text", required: false }
          - label: "정관 및 규정 (파일을 올리면 학회 소개 페이지에 다운로드 목록이 표시됩니다)"
            name: "documents"
            widget: "list"
            required: false
            summary: "{{name}}"
            fields:
              - { label: "문서 이름 (예: 학회 정관)", name: "name", widget: "string" }
              - { label: "파일", name: "file", widget: "file", media_folder: "/files/uploads", public_folder: "/files/uploads" }
          - label: "학회 채널 (비워두면 화면에 표시되지 않습니다)"
            name: "social"
            widget: "object"
            required: false
            fields:
              - { label: "페이스북 주소", name: "facebook", widget: "string", required: false }
              - { label: "네이버 카페 주소", name: "naverCafe", widget: "string", required: false }
          - label: "연동 (구글 시트 자동 기록)"
            name: "integrations"
            widget: "object"
            required: false
            fields:
              - label: "구글 시트 웹앱 주소 (비워두면 기능이 꺼집니다)"
                name: "sheetsWebhookUrl"
                widget: "string"
                required: false
                hint: "README.md의 '구글 시트 자동 연동' 안내를 따라 만든 뒤, script.google.com에서 배포한 웹 앱 URL을 붙여넣으세요."

  - name: "board"
    label: "임원진 소개"
    folder: "content/board"
    create: true
    delete: true
    extension: "json"
    format: "json"
    slug: "{{year}}{{month}}{{day}}{{hour}}{{minute}}{{second}}"
    identifier_field: "name"
    summary: "[{{group}}] {{title}} - {{name}}"
    fields:
      - { label: "이름", name: "name", widget: "string" }
      - { label: "직함", name: "title", widget: "string" }
      - { label: "구분", name: "group", widget: "select", options: ["회장단", "이사진"], default: "이사진" }
      - { label: "소속", name: "affiliation", widget: "string", required: false }
      - { label: "약력", name: "bio", widget: "text", required: false }
      - { label: "사진", name: "photo", widget: "image", required: false }

  - name: "notices"
    label: "공지사항"
    folder: "content/notices"
    create: true
    delete: true
    extension: "json"
    format: "json"
    slug: "{{year}}{{month}}{{day}}{{hour}}{{minute}}{{second}}"
    identifier_field: "title"
    summary: "{{date}} - {{title}}"
    fields:
      - { label: "제목", name: "title", widget: "string" }
      - { label: "날짜", name: "date", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD" }
      - { label: "분류", name: "category", widget: "select", options: ["일반", "학술대회", "채용", "기타"] }
      - { label: "중요 공지로 목록 맨 위에 고정", name: "pinned", widget: "boolean", default: false, required: false }
      - { label: "내용", name: "body", widget: "markdown" }
      - label: "첨부파일"
        name: "attachments"
        widget: "list"
        required: false
        summary: "{{name}}"
        fields:
          - { label: "파일 이름 (비워두면 파일명 그대로)", name: "name", widget: "string", required: false }
          - { label: "파일", name: "file", widget: "file", media_folder: "/files/uploads", public_folder: "/files/uploads" }

  - name: "education"
    label: "교육안내"
    folder: "content/education"
    create: true
    delete: true
    extension: "json"
    format: "json"
    slug: "{{year}}{{month}}{{day}}{{hour}}{{minute}}{{second}}"
    identifier_field: "title"
    summary: "{{date}} - {{title}}"
    fields:
      - { label: "제목", name: "title", widget: "string" }
      - { label: "날짜", name: "date", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD" }
      - { label: "분류", name: "category", widget: "select", options: ["강의 안내", "워크숍", "세미나", "집담회", "기타"] }
      - { label: "이 페이지에서 참가 신청 받기 (신청 폼이 글 아래에 표시됩니다)", name: "applyEnabled", widget: "boolean", default: false, required: false }
      - { label: "중요 공지로 목록 맨 위에 고정", name: "pinned", widget: "boolean", default: false, required: false }
      - { label: "내용", name: "body", widget: "markdown" }
      - label: "첨부파일"
        name: "attachments"
        widget: "list"
        required: false
        summary: "{{name}}"
        fields:
          - { label: "파일 이름 (비워두면 파일명 그대로)", name: "name", widget: "string", required: false }
          - { label: "파일", name: "file", widget: "file", media_folder: "/files/uploads", public_folder: "/files/uploads" }

  - name: "resources"
    label: "자료실"
    folder: "content/resources"
    create: true
    delete: true
    extension: "json"
    format: "json"
    slug: "{{year}}{{month}}{{day}}{{hour}}{{minute}}{{second}}"
    identifier_field: "title"
    summary: "{{date}} - {{title}}"
    fields:
      - { label: "제목", name: "title", widget: "string" }
      - { label: "날짜", name: "date", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD" }
      - { label: "분류", name: "category", widget: "select", options: ["서식", "학술자료", "발표자료", "기타"] }
      - { label: "중요 자료로 목록 맨 위에 고정", name: "pinned", widget: "boolean", default: false, required: false }
      - { label: "회원 전용 (로그인한 회원만 첨부파일을 받을 수 있습니다)", name: "membersOnly", widget: "boolean", default: false, required: false }
      - { label: "설명", name: "body", widget: "markdown" }
      - label: "첨부파일"
        name: "attachments"
        widget: "list"
        required: false
        summary: "{{name}}"
        fields:
          - { label: "파일 이름 (비워두면 파일명 그대로)", name: "name", widget: "string", required: false }
          - { label: "파일", name: "file", widget: "file", media_folder: "/files/uploads", public_folder: "/files/uploads" }

  - name: "conference"
    label: "학술대회"
    folder: "content/conference"
    create: true
    delete: true
    extension: "json"
    format: "json"
    slug: "{{year}}{{month}}{{day}}{{hour}}{{minute}}{{second}}"
    identifier_field: "title"
    summary: "{{date}} - {{title}}"
    fields:
      - { label: "제목", name: "title", widget: "string" }
      - { label: "개최일 (다가오는 일정 계산에 쓰입니다)", name: "date", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD" }
      - { label: "분류", name: "category", widget: "select", options: ["정기 학술대회", "특별 세미나", "공동 학술대회", "기타"] }
      - { label: "이 페이지에서 참가 신청 받기 (신청 폼이 글 아래에 표시됩니다)", name: "applyEnabled", widget: "boolean", default: false, required: false }
      - { label: "중요 안내로 목록 맨 위에 고정", name: "pinned", widget: "boolean", default: false, required: false }
      - { label: "내용 (일정·프로그램·등록 안내)", name: "body", widget: "markdown" }
      - label: "첨부파일 (프로그램, 초록 양식 등)"
        name: "attachments"
        widget: "list"
        required: false
        summary: "{{name}}"
        fields:
          - { label: "파일 이름 (비워두면 파일명 그대로)", name: "name", widget: "string", required: false }
          - { label: "파일", name: "file", widget: "file", media_folder: "/files/uploads", public_folder: "/files/uploads" }

  - name: "gallery"
    label: "갤러리"
    folder: "content/gallery"
    create: true
    delete: true
    extension: "json"
    format: "json"
    slug: "{{year}}{{month}}{{day}}{{hour}}{{minute}}{{second}}"
    identifier_field: "title"
    summary: "{{date}} - {{title}}"
    fields:
      - { label: "앨범 제목", name: "title", widget: "string" }
      - { label: "날짜", name: "date", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD" }
      - { label: "설명", name: "body", widget: "markdown", required: false }
      - label: "사진"
        name: "photos"
        widget: "list"
        required: false
        summary: "{{caption}}"
        fields:
          - { label: "사진", name: "image", widget: "image" }
          - { label: "설명 (선택)", name: "caption", widget: "string", required: false }
