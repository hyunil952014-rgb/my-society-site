<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>홈 | 학회 홈페이지</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32.png" />
  <link rel="apple-touch-icon" href="/images/favicon-180.png" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <header class="site-header" id="site-header"></header>

  <section class="hero" id="hero">
    <div class="container">
      <img src="/images/logo.png" alt="근거중심도수물리치료한국학회 로고" class="hero-logo" />
      <h1 id="hero-title">학회 홈페이지</h1>
      <p id="hero-tagline">잠시만 기다려 주세요...</p>
    </div>
  </section>

  <main>
    <section class="section intro-section" id="intro-section" style="display: none;">
      <div class="container">
        <p class="intro-text" id="intro-text"></p>
        <a href="/about.html" class="link-more">학회 소개 자세히 보기 &rarr;</a>
      </div>
    </section>

    <section class="section upcoming-section" id="upcoming-section" style="display: none;">
      <div class="container">
        <h2 class="section-title">다가오는 일정</h2>
        <div class="upcoming-grid" id="upcoming-list"></div>
      </div>
    </section>

    <section class="section">
      <div class="container">
        <div class="board-columns">
          <div class="board-col">
            <div class="section-head-row">
              <h2 class="section-title">공지사항</h2>
              <a href="/notices.html" class="link-more">전체보기 &rarr;</a>
            </div>
            <div class="notice-list compact" id="recent-notices">
              <p class="empty-state">불러오는 중...</p>
            </div>
          </div>

          <div class="board-col">
            <div class="section-head-row">
              <h2 class="section-title">교육안내</h2>
              <a href="/education.html" class="link-more">전체보기 &rarr;</a>
            </div>
            <div class="notice-list compact" id="recent-education">
              <p class="empty-state">불러오는 중...</p>
            </div>
          </div>
        </div>
      </div>
    </section>

    <section class="section" id="social-section" style="padding-top: 0; display: none;">
      <div class="container">
        <h2 class="section-title">학회 채널</h2>
        <p class="section-sub">지난 활동 기록과 회원 소통은 아래 채널에서도 이어집니다.</p>
        <div class="social-grid" id="social-links"></div>
      </div>
    </section>
  </main>

  <footer class="site-footer" id="site-footer"></footer>

  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  <script src="/js/site.js"></script>
  <script src="/js/home.js"></script>
</body>
</html>
