<head>

  <meta name="twitter:description" content="대한근거중심도수물리치료연구회(EMPK) 회원가입 신청 안내입니다." />
  <meta name="twitter:image" content="https://empkkorea.netlify.app/images/og-image.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32.png" />
  <link rel="apple-touch-icon" href="/images/favicon-180.png" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <header class="site-header" id="site-header"></header>

  <section class="hero">
    <div class="container">
      <h1>회원가입 신청</h1>
      <p>회비 없이 누구나 가입하실 수 있습니다. 확인 후 이메일로 초대 메일을 보내드립니다.</p>
    </div>
  </section>

  <main id="main">
    <section class="section">
      <div class="container" style="max-width: 560px;">
        <form
          name="member-application"
          method="POST"
          data-netlify="true"
          netlify-honeypot="bot-field"
          action="/join-success.html"
          class="card apply-form"
        >
          <input type="hidden" name="form-name" value="member-application" />
          <input type="hidden" name="formType" value="회원가입" />
          <p class="hp-field">
            <label>비워두세요: <input name="bot-field" /></label>
          </p>

          <label class="form-label" for="name">이름 *</label>
          <input class="form-input" type="text" id="name" name="name" required />

          <label class="form-label" for="affiliation">소속 *</label>
          <input class="form-input" type="text" id="affiliation" name="affiliation" required />

          <label class="form-label" for="phone">연락처 *</label>
          <input class="form-input" type="tel" id="phone" name="phone" required />

          <label class="form-label" for="email">이메일 *</label>
          <input class="form-input" type="email" id="email" name="email" required />

          <label class="form-label" for="interest">참가하려는 교육·행사 (선택)</label>
          <select class="form-input" id="interest" name="interest">
            <option value="">없음 (가입만 신청)</option>
          </select>

          <label class="form-label" for="message">가입 동기 / 하고 싶은 말 (선택)</label>
          <textarea class="form-input" id="message" name="message" rows="4"></textarea>

          <p class="form-notice">
            제출하신 정보는 회원 가입 확인 목적으로만 사용됩니다. 확인 후 입력하신 이메일로
            초대 메일을 보내드리며, 메일의 링크에서 비밀번호를 정하면 바로 로그인됩니다.
          </p>

          <button type="submit" class="form-submit">가입 신청하기</button>
        </form>
      </div>
    </section>
  </main>

  <footer class="site-footer" id="site-footer"></footer>

  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  <script src="/js/site.js"></script>
  <script>
    initLayout().then((site) => {
      const url = site && site.integrations && site.integrations.sheetsWebhookUrl;
      const form = document.querySelector('form[name="member-application"]');
      if (url && form) {
        form.addEventListener("submit", () => sendToSheetsWebhook(form, url));
      }
    });

    // Offer the events that are currently taking applications, and preselect
    // the one the visitor came from (?event=<id>).
    (async function () {
      const select = document.getElementById("interest");
      const wanted = new URLSearchParams(window.location.search).get("event");
      let items = [];
      try {
        items = ((await fetchJSON("/content/education.json")).items || []).filter((n) => n.applyEnabled);
      } catch (e) {
        console.error(e);
      }
      items.forEach((n) => {
        const opt = document.createElement("option");
        opt.value = n.title;
        opt.textContent = n.title;
        opt.dataset.id = n.id;
        if (String(n.id) === wanted) opt.selected = true;
        select.appendChild(opt);
      });
      // Picking an event here means: open that event page after the first login.
      document.querySelector('form[name="member-application"]').addEventListener("submit", () => {
        const id = select.selectedOptions[0] && select.selectedOptions[0].dataset.id;
        if (id) rememberReturnTo(`/education.html?id=${encodeURIComponent(id)}`);
      });
    })();
  </script>
</body>
</html>
